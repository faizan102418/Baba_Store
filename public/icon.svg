<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <!-- Shopping Basket / Store Front Icon -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Store Canopy -->
    <path d="M 60 160 L 452 160 L 412 80 L 100 80 Z" fill="url(#gold)" />
    <!-- Shop Body -->
    <rect x="80" y="170" width="352" height="250" rx="20" fill="#ffffff" />
    <!-- Counter / Shelf lines -->
    <rect x="120" y="210" width="100" height="90" rx="12" fill="#10b981" />
    <rect x="250" y="210" width="142" height="90" rx="12" fill="#0f172a" />
    <circle cx="170" cy="255" r="22" fill="#ffffff" />
    <!-- Urdu text: بابو -->
    <text x="320" y="268" font-family="sans-serif" font-weight="900" font-size="44" fill="#fbbf24" text-anchor="middle">BABO</text>
    <!-- Register Drawer Base -->
    <rect x="120" y="325" width="272" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="4" />
    <circle cx="256" cy="355" r="10" fill="#f59e0b" />
  </g>
</svg>
